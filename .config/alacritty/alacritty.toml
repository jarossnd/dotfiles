
# Catppuccin theme
[general]
import = [
    "~/.config/alacritty/catppuccin-mocha.toml"
]

# Font configuration
[font]
size = 12.0

[font.normal]
family = "MonoLisa"
style = "Regular"

[font.bold]
family = "MonoLisa"
style = "Bold"

[font.italic]
family = "MonoLisa"
style = "Italic"

[font.bold_italic]
family = "MonoLisa"
style = "Bold Italic"

